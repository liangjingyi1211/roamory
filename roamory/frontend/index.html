<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roamory daily workspace</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#timeline">跳转到当天时间线</a>
<div class="app-shell">
  <aside class="geo-column" aria-label="当天地点地图与详情">
    <section class="map-panel" aria-label="当天地点地图"><div id="map-status" role="status"></div><div id="map" aria-label="Google Maps 当天地点地图"></div></section>
    <section class="place-panel" aria-label="选中地点详情"><span id="place-kind" hidden></span><div id="place-detail" aria-live="polite"><div class="place-empty">选择行程中的地点查看详情</div></div></section>
  </aside>
  <main class="journey-content" id="journey-content" aria-label="旅程日历与每日时间线" tabindex="-1">
  <nav class="journey-links" aria-label="旅行空间"><a href="?view=new" target="_self">规划旅程</a><a href="?view=trips" target="_self">我的行程</a><a href="?view=journals" target="_self">我的旅行日记</a></nav>
  <nav class="days" aria-label="每日行程"><div class="eyebrow">旅程日历</div><div id="days"></div></nav>
      <section class="schedule" aria-label="当天行程"><div id="feedback" role="status" aria-live="polite"></div><div id="warnings"></div><div id="timeline" tabindex="-1"></div><div id="additions"></div><div id="notes"></div></section>
<section class="assistant" aria-label="AI 行程助手">
  <div class="assistant-head"><div><strong>AI 行程助手</strong><span id="chat-context"></span></div><span class="chat-hint">替换 · 增加 · 单日重新规划</span></div>
  <details class="chat-history"><summary>对话记录 <span id="chat-count"></span></summary><div id="chat-messages" role="log" aria-live="polite"></div></details>
  <form id="chat-form"><label class="sr-only" for="chat-input">告诉 AI 想修改什么</label><textarea id="chat-input" rows="1" maxlength="2000" placeholder="把第二天午餐换成附近的日料，其他安排不要变"></textarea><button id="chat-send" type="submit">发送</button></form>
  <div id="chat-status" role="status" aria-live="polite"></div><button id="chat-retry" type="button" hidden>重试上次请求</button>
  <p class="assistant-foot">仅修改当前旅程 · 删除和改时间请用卡片按钮 · 对话记录不写入数据库</p>
</section>
  </main>
</div>
<script src="surface.js"></script><script src="place-details.js"></script><script src="app.js"></script>
</body></html>
