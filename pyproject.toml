[project]
name = "roamory"
version = "0.1.0"
description = "Roamory travel planning and personal journals powered by Google ADK"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-adk>=1.0,<3",
  "streamlit>=1.35,<2",
  "python-dotenv>=1,<2",
  "pydantic>=2,<3",
  "pillow>=10,<14",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
